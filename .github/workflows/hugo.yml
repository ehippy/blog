# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Deploy Hugo site to S3

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded run so an older, slower build can't finish and
# overwrite production after a newer push has already deployed.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true
      - name: Build with Hugo
        # Outputs to the './public' directory by default. Hugo Extended's
        # built-in libwebp handles resizing + WebP encoding natively, so
        # there's no separate image-processing step or dependency to install.
        run: hugo --minify
        env:
          HUGO_ENV: production
      - name: Minify JavaScript
        run: |
          npm install -g terser
          if [ -f ./public/js/app.js ]; then
            terser ./public/js/app.js -c -m -o ./public/js/app.js
          fi
      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: site_content
          path: ./public

  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download all workflow run artifacts
      uses: actions/download-artifact@v4
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.BLOG_PUBLISH_AWS_KEY }}
        aws-secret-access-key: ${{ secrets.BLOG_PUBLISH_AWS_SECRET }}
        aws-region: us-east-1

    - name: Deploy static site to S3 bucket
      run: |
        # Hugo's native image pipeline (layouts/partials/picture-core.html) publishes
        # resized/webp variants as /images/<name>_hu_<contenthash>.<ext> — genuinely
        # content-hashed, unlike the old libvips-script output, so they're safe to
        # cache for a year: a source-image edit produces a new filename rather than
        # invalidating a cached one. Skip --delete so a variant an old cached HTML
        # page still points at isn't removed before that HTML's cache expires.
        aws s3 sync ./site_content/images s3://patrickmcdavid.com/images --exclude "*" --include "*_hu_*" --acl public-read --cache-control "public, max-age=31536000, immutable"
        # CSS filenames ARE fingerprinted (content hash), but skip --delete so
        # an old fingerprinted file a client's cached HTML still points at
        # isn't removed out from under it before that HTML's cache expires.
        aws s3 sync ./site_content/css s3://patrickmcdavid.com/css --acl public-read --cache-control "public, max-age=86400"
        aws s3 sync ./site_content/js s3://patrickmcdavid.com/js --delete --acl public-read --cache-control "public, max-age=86400"
        # Don't cache HTML (or short cache). Unprocessed image originals under
        # /images/ (favicon, OG-image source, the <img> fallback src) aren't
        # content-hashed, so they fall through to here too, capped at an hour.
        aws s3 sync ./site_content s3://patrickmcdavid.com --delete --acl public-read --cache-control "public, max-age=3600" --exclude "images/*_hu_*" --exclude "css/*" --exclude "js/*"
    - name: Invalidate Cloudfront
      run: aws cloudfront create-invalidation --distribution-id E2BXX0VHQEULW0 --paths "/*"
