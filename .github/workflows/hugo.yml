# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Deploy Hugo site to S3

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true
      - name: Install image processing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev libvips-tools libpng-dev libjpeg-dev libwebp-dev libheif-dev webp
      - name: Build with Hugo
        # Outputs to the './public' directory by default
        run: hugo --minify
        env:
          HUGO_ENV: production
      - name: Generate responsive image variants
        run: ./tools/generate_images.sh ./public
      - name: Minify JavaScript
        run: |
          npm install -g terser
          if [ -f ./public/js/app.js ]; then
            terser ./public/js/app.js -c -m -o ./public/js/app.js
          fi
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site_content
          path: ./public

  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download all workflow run artifacts
      uses: actions/download-artifact@v4
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.BLOG_PUBLISH_AWS_KEY }}
        aws-secret-access-key: ${{ secrets.BLOG_PUBLISH_AWS_SECRET }}
        aws-region: us-east-1

    - name: Deploy static site to S3 bucket
      run: |
        # Cache generated images forever (content hash in filename)
        aws s3 sync ./site_content/generated s3://patrickmcdavid.com/generated --delete --acl public-read --cache-control "public, max-age=31536000, immutable"
        # Cache CSS/JS for 1 day
        aws s3 sync ./site_content/css s3://patrickmcdavid.com/css --delete --acl public-read --cache-control "public, max-age=86400"
        aws s3 sync ./site_content/js s3://patrickmcdavid.com/js --delete --acl public-read --cache-control "public, max-age=86400"
        # Don't cache HTML (or short cache)
        aws s3 sync ./site_content s3://patrickmcdavid.com --delete --acl public-read --cache-control "public, max-age=3600" --exclude "generated/*" --exclude "css/*" --exclude "js/*"
    - name: Invalidate Cloudfront
      run: aws cloudfront create-invalidation --distribution-id E2BXX0VHQEULW0 --paths "/*"
