      - generic [ref=f4e56]:
        - paragraph [ref=f4e57]:
          - text: Amazon’s
          - link "Two-Pizza-Teams" [ref=f4e58] [cursor=pointer]:
            - /url: https://www.theguardian.com/technology/2018/apr/24/the-two-pizza-rule-and-the-secret-of-amazons-success
          - text: is a scaling methodology that suggests organizational designers ensure independence and speed by keeping ownership of products to teams that can be fed by no more than two pizzas. These teams need total decision-making authority of their product, and a clear understanding of what success means for them. This works well for Amazon as these small teams behave as composable units of opportunity and service for customers internal and external.
        - paragraph [ref=f4e59]: Two pizza teams are about eight people, plus or minus two. That’s a great size to have a mix of analysts, engineers, quality and success folks. This article is about a bad habit I’ve had in building products under the direct care of only one person, usually an engineer; a two-slice team.
        - heading "It starts innocently enough" [level=3] [ref=f4e60]
        - paragraph [ref=f4e61]: In building consumer software, research and development need to be two different things. I’ve been guilty too many times of assigning a single engineer to do some exploratory development on a new product or sizeable feature, and then not reinforcing their efforts enough as the research leaves the lab.
        - paragraph [ref=f4e62]:
          - text: "The story goes like this: there’s a new platform we want to install some technology into. A fearless and talented developer dives in and by Friday she has a deceptively slick looking proof of concept of the main workflow. There’re some"
          - emphasis [ref=f4e63]: obviously
          - text: rough edges, so, sure, why not keep going until the demo is like butter. By this time the engineer’s started an expanding list of
          - code [ref=f4e64]: //TODOs
          - text: that are really more critical than they are nice-to-have.
        - paragraph [ref=f4e65]: Without stopping, a few weeks later, this prototype is being talked about like it’s customer-ready software. Pretty soon marketing and customer success are being spun up to trumpet about this achievement to your customer base, and before you know it this research product has paying customers, problems, and is going to need love and support for years.
        - heading "That was fast" [level=3] [ref=f4e66]
        - paragraph [ref=f4e67]: What I just described isn’t necessarily indefensible. There are times when you want to parachute in and make something available in short order. Just do it sparingly. Don’t make a habit of having hero-engineers launching half-mature hit after hit without stopping to take stock.
        - paragraph [ref=f4e68]: "At about the second week of an exploratory project it’s time to stop and take stock of what the future of this line of development is really going to take:"
        - list [ref=f4e69]:
          - listitem [ref=f4e70]: What are the six hacks that made this look more robust than it really is?
          - listitem [ref=f4e71]: What’s weird or unique about this new environment that we don’t really understand yet?
          - listitem [ref=f4e72]: What parts of this are going to need some automated tests and deeper QA?
          - listitem [ref=f4e73]: Now that we have a sense of this thing, what should we adjust about the original plan?
          - listitem [ref=f4e74]: How much ongoing time are we going to need to feed this project after v1 is out the door?
          - listitem [ref=f4e75]:
            - text: Is this MVP a minimally
            - emphasis [ref=f4e76]: loveable
            - text: product?
        - paragraph [ref=f4e77]: Take stock of these concerns now. Do with them what you will, but at least have the estimates and information.
        - heading "Too lean too long" [level=3] [ref=f4e78]
        - paragraph [ref=f4e79]:
          - emphasis [ref=f4e80]: “If you want to go fast, go alone; if you want to go far, go together.”
          - text: –
          - link "Unknown" [ref=f4e81] [cursor=pointer]:
            - /url: https://www.npr.org/sections/goatsandsoda/2016/07/30/487925796/it-takes-a-village-to-determine-the-origins-of-an-african-proverb
        - paragraph [ref=f4e82]: This lesson is about portfolio management. After a few months carrying all the water for this product, this person is going to be burning out. The problems they’re struggling with are going to be taking on a character of insurmountability. The project needs fresh eyes and diversity of thought. You’ve got to either staff up a team around this project, or fold the project and the engineer into another group that can afford to lend a hand.
        - paragraph [ref=f4e83]: How many of these major features/projects exist for your team? How many exist whose engineer has been reassigned, likely repeatedly?
        - paragraph [ref=f4e84]: Automation is the aim in software, so to some degree it’s desireable to have bits that’re trustworthy and haven’t been touched in a year. Something like this is going to be well-instrumented and alarmed, and it’s not going to generate customer success challenges. However, that level of maturity isn’t going to happen in a worthwhile timeframe under a single caregiver.
        - heading "Make a list, check it twice" [level=3] [ref=f4e85]
        - paragraph [ref=f4e86]: "Have a spreadsheet that maps out your organizations’ portfolio: the applications, major features and subsystems and the wellness thereof. Who knows these systems? What’s the future interest in developing them? What should be actively sunset? Estimate the commitment it would take to give the care you want these systems to have."
        - paragraph [ref=f4e88]: "You’re going to be short of what you want, nobody ever gets ahead of the list. The question is are you putting resources where you expect to be growing the business? How many C-grade features do you have in the field that are a drag to support and make the staff cringe? Are you understaffed 15% of where you’d like to be or 40%? What’s going to give? Have that conversation with the larger organization. Suggest specific changes: cuts, simplifications, pesky-time-stealers."
        - heading "Do the right thing" [level=3] [ref=f4e89]
        - paragraph [ref=f4e90]:
          - text: Stop and plan. The allure of another quick-hit major feature delivered by a stellar talent
          - emphasis [ref=f4e91]: is
          - text: too good to be true. Products need a diversity of supporting actors to thrive in the long term. Engineers need a breadth of challenge and opportunities to keep them interested, learning and happy. Don’t shy from the exploratory work, go and learn about where you want to venture. But, if you’re going to take something on, take it all the way on. Give it the team it needs.
