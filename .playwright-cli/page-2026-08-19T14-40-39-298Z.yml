        - heading "Two-Slice Software Teams" [level=1] [ref=f4e51]
        - paragraph [ref=f4e52]:
          - text: December 15, 2018 ~ 4 min read ~
          - link "Software Engineering" [ref=f4e53] [cursor=pointer]:
            - /url: /archive/?tag=software%20engineering
          - text: ","
