        - paragraph [ref=f3e52]: Software engineering leader, architect, father and philosopher
      - generic [ref=f3e54]:
        - paragraph [ref=f3e55]:
          - text: I’ve spent the better part of two decades leading engineering work that scales. I’ve played key roles in guiding products from early-stage scrappiness to long-term viability — including one that became
          - link "a killer, high-growth product" [ref=f3e56] [cursor=pointer]:
            - /url: https://bombbomb.com
          - text: "{:target=\"_blank\"}. My work tends to sit at the intersection of systems, people, and thoughtful progress."
        - paragraph [ref=f3e57]:
          - text: I’ve built across the stack,
          - link "led teams through high-growth phases" [ref=f3e58] [cursor=pointer]:
            - /url: /twosliceteams/
          - text: ", and recently focused on using large language models to improve developer experience and product impact. These days, I think a lot about how the tools we make ripple out into the world—not just in terms of performance and reliability, but"
          - link "sustainability" [ref=f3e59] [cursor=pointer]:
            - /url: /accidentally-carbon-neutral/
          - text: ", clarity, and human impact."
        - paragraph [ref=f3e60]: I live in Colorado Springs with my two kids, where we spend a lot of time outdoors. You’ll find us getting dirty camping, hiking, or swimming. My nine-year-old is getting into cooking, which means our kitchen experiments are getting more interesting (and messier).
