        - 'heading "Icarus: My First Game Jam" [level=1] [ref=f5e51]'
        - paragraph [ref=f5e52]:
          - text: November 12, 2025 ~ 6 min read ~
          - link "Game Design" [ref=f5e53] [cursor=pointer]:
