      - generic [ref=f5e56]:
        - paragraph [ref=f5e57]:
          - text: Here’s the story of how I wrote
          - link "a little piece of Sci-Fi Horror" [ref=f5e58] [cursor=pointer]:
            - /url: https://kinggeekus.itch.io/icarus
          - text: for a game jam and ended up winning some stellar awards! Read on for a casual design diary of a ship in deep shit.
        - heading "Mothership" [level=2] [ref=f5e59]
        - generic [ref=f5e60]: "{% picture mothership.png alt=\"Mothership Players Survival Guide\" %}"
        - paragraph [ref=f5e61]:
          - text: In late 2019 some lovely friends and I got together and played Dungeons and Dragons together every couple weeks for more than two years. It’s one of my favorite gaming memories ever and it introduced me to tabletop role playing games. Since then I’ve run and played a number of different tabletop games, and my latest favorite is a neat
          - link "lo-fi, sci-fi, zine-flavored horror thing called Mothership" [ref=f5e62] [cursor=pointer]:
            - /url: https://www.tuesdayknightgames.com/pages/mothership-rpg
          - text: .
        - generic [ref=f5e63]: "{% picture Ypsilon-14.png alt=\"The Haunting of Ypsilon-14\" %}"
        - paragraph [ref=f5e64]:
          - text: One of the best things about Mothership is its rich third-party content ecosystem. There are hundreds of folks making all kinds of fun add-ons for the game. New stories, space ships, tools and more are published constantly. These range from
          - link "200 page, hardbound anthologies of fun stuff for $50" [ref=f5e65] [cursor=pointer]:
            - /url: https://www.tuesdayknightgames.com/products/hull-breach
          - text: to little 10 page zines, all the way down to Mothership’s hallmark trifolds. This yellow one to the left here is the quintessential mothership adventure, and the whole story fits on a double-sided sheet of paper.
        - paragraph [ref=f5e66]: I adore these little publications because they’re little fun-snacks. A whole scenario the game master can read and internalize in 15 minutes. The good ones all have some great hook, prime evil, or creative new thing for the players to stumble into and figure out.
        - heading "A little push to get started" [level=2] [ref=f5e67]
        - paragraph [ref=f5e68]:
          - text: I’ve never been a homebrew guy. I liked running authored adventures for my players, as I thought the whole endeavor of dreaming a whole world up was so terribly daunting. But, a little tri-fold? Shoot I could manage that. I’d been puttering around with an idea for one for a month or two when I came across an
          - link "in-progress game jam specifically for Mothership tri-folds" [ref=f5e69] [cursor=pointer]:
            - /url: https://itch.io/jam/triptech2
          - text: called TripTech
          - superscript [ref=f5e70]: "2"
          - text: . This game jam only went on for three weeks, and I was coming to it with only half that remaining.
        - paragraph [ref=f5e71]: TripTech’s theme was “Impossibly Perfect”, so I sketched out some too-good-to-be-true space horror scenarios. I met some buddies for an evening at the pub and we shot some thoughts around and came up with a tight little sci-fi thriller about a fast spaceship that’s going to do a close, faster-than-light slingshot-maneuver over the surface of a star. I’m not sure we nailed impossibly perfect with a ship that can use a sun to hop from planet to planet, but it does turn out too good to be true.
        - paragraph [ref=f5e72]: "{% picture icarusNotes.png alt=“Notes about icarus” %}"
        - heading "Building a dying ship" [level=2] [ref=f5e73]
        - paragraph [ref=f5e74]: I brought the idea home and set to work trying to create a cast of characters and some challenges to overcome. Then for the next couple weeks I’d spend an hour or two most nights toiling over a hot design app to mash together something I liked.
        - img "Animated refinements to the layout" [ref=f5e76]
        - paragraph [ref=f5e77]:
          - text: "I started with layout first, and ended up writing the whole thing in a graphic design program, Figma, rather than in a word processor. I don’t think I’ll ever do that again, its spelling/grammar tools are weak. I fiddled and futzed with the language: I went with fun on-the-nose names like"
          - strong [ref=f5e78]: Dr. Haste
          - text: and
          - strong [ref=f5e79]: Engineer Patch
          - text: for the characters, which I think made it simple to internalize.
        - paragraph [ref=f5e80]: Having to fit so much text into such precise little spaces was a fun little game.
        - paragraph [ref=f5e81]:
          - text: One big gamble I decided to go with was to have almost a whole panel of the two-sided trifold be an introductory narrative to set the stage and put the characters in harm’s way. In some ways this is antithetical to the roleplaying to sink the characters like this without their agency. But I think it works really well as what the
          - link "Lazy Dungeonmaster calls a Strong Start" [ref=f5e82] [cursor=pointer]:
            - /url: https://slyflourish.com/starting_strong.html
          - text: .
        - paragraph [ref=f5e83]:
          - text: Another thing I wrestled with was the inclusion of a
          - link "Newt" [ref=f5e84] [cursor=pointer]:
            - /url: https://avp.fandom.com/wiki/Rebecca_%22Newt%22_Jorden
          - text: "-esque child in the story for the characters to discover, save and be aided by. I got some strong feedback that this was cheap or unnecessary. Two or three times I removed and re-added the character, and I’m glad I left them as a roleplay cornerstone and opposite to the big-bad of the story."
        - paragraph [ref=f5e85]: I found a person willing to do a little art for a ship. I shared versions with the other jam participants and got lots of great feedback. It was a riot.
        - heading "Shipping a disaster" [level=2] [ref=f5e86]
        - paragraph [ref=f5e87]:
          - text: As I got close to final, I was able to get a license for
          - emphasis [ref=f5e88]: Icarus
          - text: from the Mothership publisher, and I submitted my entry to the game jam.
        - paragraph [ref=f5e89]:
          - 'link "{% picture IcarusItchCoverWithAwards.png alt=“Cover art for Icarus, featuring a burning star” %}" [ref=f5e90] [cursor=pointer]':
            - /url: https://kinggeekus.itch.io/icarus
        - paragraph [ref=f5e91]: "I felt like I’d done a good job, but also like I had some stiff competition from the other submissions. I spent the next few days reading and rating all 32 entries to the jam. I was particularly impressed with some of the entries with really slick art:"
        - generic [ref=f5e92]:
          - generic [ref=f5e93]: "{% picture triptech_Minerva.png alt=\"Minerva\" %}"
          - generic [ref=f5e94]: "{% picture triptech_NeonDreamGirl.png alt=\"Neon Dream Girl\" %}"
          - generic [ref=f5e95]: "{% picture triptech_Xiao.png alt=\"Xiao\" %}"
        - text: It was fun to read through these murder mysteries, generation-ship intrigues and deadly dumpling houses.
        - heading "Celebrations all around" [level=2] [ref=f5e96]
        - paragraph [ref=f5e97]:
          - text: Immediately after the jam concluded, the community ratings were available on
          - link "itch.io" [ref=f5e98] [cursor=pointer]:
            - /url: https://itch.io/jam/triptech2/results
          - text: ", and Icarus took second place under the delightful"
          - link "Xiao! Long! Bao!" [ref=f5e99] [cursor=pointer]:
            - /url: https://xiaofang64.itch.io/xiao-long-bao
          - text: .
        - paragraph [ref=f5e100]:
          - text: A week later TripTech’s panel of judges handed out the awards for a number of categories and, blowing my mind,
          - emphasis [ref=f5e101]: "Icarus took four of them:"
        - list [ref=f5e102]:
          - listitem [ref=f5e103]:
            - text: The
            - strong [ref=f5e104]: Jury Grand Prize
            - text: for Best Overall Entry
          - listitem [ref=f5e105]: Best Writing
          - listitem [ref=f5e106]: Best Game Design
          - listitem [ref=f5e107]: Best Utility
          - listitem [ref=f5e108]: Community Select (2nd place in community voting)
        - paragraph [ref=f5e109]: I was blown away. There were so many cool entries! I think Icarus stood out in part for being very immediate and in your face. The scenario starts you essentially on fire, and needing to solve yourself out of harm’s way from the jump.
        - heading "Playing with fire, and some other dads" [level=2] [ref=f5e110]
        - paragraph [ref=f5e111]: I had those same friends over last week and sat down to have an analog good time laughing and rolling dice playing through Icarus. They sent my little story through the wringer, they did a few different things I never expected. One player’s character died walking through fire to save his friends. Another character died being torn apart by a reprogrammed android. In the end they saved the day and escaped.
        - paragraph [ref=f5e112]: "{% picture icarusOnTheTable.jpg alt=“Dads rolling dice” %}"
        - paragraph [ref=f5e113]: They were able to short-circuit one of the puzzle challenges and skip a whole corner of the ship, but that’s fine, those NPCs are still lurking on the ship for the next session. Much fun was had by all.
        - heading "She’s out there, somewhere" [level=2] [ref=f5e114]
        - paragraph [ref=f5e115]:
          - text: I put it
          - link "up for sale on itch.io for a couple bucks" [ref=f5e116] [cursor=pointer]:
            - /url: https://kinggeekus.itch.io/icarus
          - text: . I invite you to take a look. I even added a little supplement to flesh out the titular ship herself in case she survives the scenario and the players, perhaps, comandeer her. 😉
        - iframe [ref=f5e118]:
          - generic [ref=f6e3]:
            - link "Visit itch.io":
              - /url: http://itch.io
            - generic [ref=f6e9]:
              - heading [level=1] [ref=f6e10]:
                - 'link "Icarus: A Hot Mothership One-Shot" [ref=f6e11] [cursor=pointer]':
                  - /url: https://kinggeekus.itch.io/icarus
              - heading [level=2] [ref=f6e12]:
                - text: by
                - link "KingGeekus" [ref=f6e13] [cursor=pointer]:
                  - /url: https://kinggeekus.itch.io
              - heading "Some say shooting a jump drive towards the sun is a bad idea!" [level=3] [ref=f6e14]
              - generic [ref=f6e15]: $3.00 USD or more
              - generic [ref=f6e16]:
                - link "Buy Now" [ref=f6e17] [cursor=pointer]:
                  - /url: https://kinggeekus.itch.io/icarus/purchase?popup=1
                - text: with PayPal, Credit Card
        - paragraph [ref=f5e119]: I’m looking forward to hearing from folks that run it how it went. I’m hoping to get the publishers of Mothership to stock some physical copies in their store. We’ll see. In any case, what a fun ride. I may run Icarus for some other friends soon, and TripTech3 is only a few months away.
