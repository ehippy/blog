# Hugo config — ported from Jekyll _config.yml
# (jekyll-paginate → pagination.pagerSize, jekyll-feed/jekyll-sitemap → built-in
#  RSS + sitemap, jekyll_picture_tag → tools/generate_images.sh + picture partial,
#  kramdown+rouge → goldmark+chroma)

baseURL = "https://patrickmcdavid.com/"
locale = "en"
title = "Patrick McDavid"
description = "I'm a technology leader in Colorado speaking about serverless computing, team building, devops, and leadership development."

# Jekyll: paginate: 6, paginate_path: /page:num/
pagination.pagerSize = 6

enableRobotsTXT = true

# Tags/categories are surfaced via the client-side filter on /archive/, not
# Hugo's native taxonomy pages, so skip generating those.
disableKinds = ["taxonomy", "term"]

[outputs]
home = ["HTML", "RSS"]
section = ["RSS"]

[outputFormats.RSS]
  # Jekyll served the feed at /feed.xml (see data/settings.yml rss_url);
  # Hugo defaults to /index.xml. Keep the old path for existing subscribers.
  baseName = "feed"

# Jekyll: markdown: kramdown (GFM) + rouge highlighting.
# Hugo: goldmark is GFM by default; Chroma is rouge-compatible.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Content contains raw HTML (JSON-LD scripts, floated divs)
      unsafe = true
  [markup.highlight]
    noClasses = true
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "base16-snazzy"

# jekyll_picture_tag → tools/generate_images.sh (shelled out to libvips/cwebp) →
# now Hugo Pipes' native image processing (layouts/partials/picture-core.html).
# Images live in static/images/ (so favicon.png, OG-image URLs, and the raw
# fallback <img src> all keep serving from /images/ unprocessed), but adding an
# explicit [[module.mounts]] block replaces Hugo's implicit defaults, so the
# usual set has to be re-declared alongside the extra mount that also exposes
# static/images/ as assets/images/ for resources.Get to resize/re-encode.
[module]
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

[permalinks]
  # Jekyll derived a post's URL from its filename (date prefix stripped), not
  # its title. Posts now use dated filenames (2018-11-03-best-company.md) for
  # chronological browsability, with an explicit `slug:` front-matter field
  # carrying the original date-free Jekyll slug — Hugo prefers an explicit
  # slug over both the filename and its title-derived fallback, so URLs still
  # match the pre-migration site exactly.
  post = "/:slug/"

# The Jekyll-era html-minifier kept quoted attribute values; Hugo's --minify
# strips them by default, which the html-validate CI check (attr-quotes rule)
# flags as an error on every page. Keep quoting to match prior output.
[minify.tdewolff.html]
  keepQuotes = true
